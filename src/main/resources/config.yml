settings:
  # Язык сообщений плагина: ru, en или auto (по локали игрока)
  language: auto

  # Какими способами можно садиться. Каждый способ включается независимо.
  sit:
    # Команда /sit (сесть на месте; повторный /sit — встать)
    command: true
    # ПКМ по подходящему блоку (см. block.allowed)
    block: true
    # ПКМ по другому игроку — сесть ему на голову
    player: true

  # Другие позы. Включаются независимо.
  pose:
    # Команда /lay (лежание; выход — shift или повторный /lay)
    lay: true
    # Команда /crawl (ползанье; выход — повторный /crawl)
    crawl: true

  # Посадка на блоки
  block:
    # Требовать пустые обе руки
    require-empty-hand: true
    # Не садиться, если игрок крадётся (shift)
    deny-when-sneaking: true
    # На что можно садиться: имена материалов (OAK_STAIRS) или теги блоков с "#" (#stairs, #slabs, #minecraft:wool_carpets).
    # Ступеньки — только нижние, плиты — любые.
    allowed:
      - "#stairs"
      - "#slabs"

  # Посадка на игроков
  player:
    # Требовать пустые обе руки
    require-empty-hand: true
    # Садиться только если игрок крадётся (shift)
    require-sneaking: false

  seat:
    # Поправка высоты посадки (в блоках) для сидений на блоках, на месте и при /grab.
    # Если игрок «утопает» в блоке или парит над ним — подберите значение (например, 0.1 или -0.1).
    y-offset: 0.0
